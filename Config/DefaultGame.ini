; Shell_UE 流控键范式声明：本宿主用世界面片/呈现态架构承载终端，
; 面板不得消费 Tab/ESC（详见 EShellFlowKeyMode）——Tab=切换呈现态、ESC=退出输入态。
[/Script/Shell_UE.ShellSettings]
FlowKeyMode=HostOwned

; --- M5：快捷指令呈现 + 热键 ---
; 呈现方式：世界空间悬浮按钮（贴在世界面片旁，跟随手持姿态）。
QuickBarMode=FloatingButton
; 悬浮按钮相对面片中心的局部偏移（cm；+X 法线朝玩家，+Y 右，+Z 上）= 右下外侧。
FloatingButtonOffset=(X=2.000000,Y=52.000000,Z=-22.000000)
FloatingButtonSizeCm=6.000000
FloatingMenuWidthCm=40.000000
FloatingMenuMaxHeightCm=44.000000
FloatingMenuMaxVisibleRows=12
; 全局菜单开关键：LeftAlt（避开 Tab —— PIE 内 Tab 会被编辑器全局命令兜底层吃掉）。
FloatingMenuToggleChord=(Key=LeftAlt,bCtrl=False,bAlt=False,bShift=False,bCmd=False)
; 热键必须带 Ctrl/Alt/Cmd（裸键要留给打字）。
bRequireModifierForHotkey=True
; 管理态（GUI 可视化编辑）本次未实现，开关保持关闭：SetMode(Manage) 为安全 no-op。
bEnableManageMode=False
bShowHotkeyBadgeInMenu=True
